name: Build Aseprite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Aseprite Repository
      uses: actions/checkout@v4
      with:
        repository: aseprite/aseprite
        submodules: recursive
    
    - name: Set up Visual Studio Environment
      uses: microsoft/setup-msbuild@v2
    
    - name: Install Dependencies
      run: |
        choco install ninja cmake -y
    
    - name: Download Skia
      shell: pwsh
      run: |
        $SkiaVersion = "m124-e1829696e6"
        $SkiaUrl = "https://github.com/aseprite/skia/releases/download/$SkiaVersion/Skia-Windows-Release-x64.zip"
        Invoke-WebRequest -Uri $SkiaUrl -OutFile Skia-Windows-Release-x64.zip
        Expand-Archive -Path Skia-Windows-Release-x64.zip -DestinationPath C:\deps\skia
    
    - name: Configure CMake
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR=C:\deps\skia -DSKIA_LIBRARY_DIR=C:\deps\skia\out\Release-x64 -DSKIA_LIBRARY=C:\deps\skia\out\Release-x64\skia.lib -G Ninja ..
    
    - name: Build Aseprite
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
        cd build
        ninja aseprite
    
    - name: Package Aseprite
      run: |
        mkdir aseprite-windows
        cp build/bin/aseprite.exe aseprite-windows/
        cp -r build/bin/data aseprite-windows/
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aseprite-windows
        path: aseprite-windows/

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Aseprite Repository
      uses: actions/checkout@v4
      with:
        repository: aseprite/aseprite
        submodules: recursive
    
    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y g++ clang cmake ninja-build libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
    
    - name: Download Skia
      run: |
        curl -L -o Skia-Linux-Release-x64-libstdc++.zip https://github.com/aseprite/skia/releases/download/m124-e1829696e6/Skia-Linux-Release-x64-libstdc++.zip
        unzip Skia-Linux-Release-x64-libstdc++.zip -d $HOME/deps/skia
    
    - name: Configure and Build
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR=$HOME/deps/skia -DSKIA_LIBRARY_DIR=$HOME/deps/skia/out/Release-x64 -DSKIA_LIBRARY=$HOME/deps/skia/out/Release-x64/libskia.a -G Ninja ..
        ninja aseprite
    
    - name: Package Aseprite
      run: |
        mkdir aseprite-linux
        cp build/bin/aseprite aseprite-linux/
        cp -r build/bin/data aseprite-linux/
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aseprite-linux
        path: aseprite-linux/

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Aseprite Repository
      uses: actions/checkout@v4
      with:
        repository: aseprite/aseprite
        submodules: recursive
    
    - name: Install Dependencies
      run: |
        brew install cmake ninja
    
    - name: Download Skia (ARM64)
      run: |
        curl -L -o Skia-macOS-Release-arm64.zip https://github.com/aseprite/skia/releases/download/m124-e1829696e6/Skia-macOS-Release-arm64.zip
        unzip Skia-macOS-Release-arm64.zip -d $HOME/deps/skia
    
    - name: Configure and Build
      run: |
        mkdir build
        cd build
        cmake \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DLAF_BACKEND=skia \
          -DSKIA_DIR=$HOME/deps/skia \
          -DSKIA_LIBRARY_DIR=$HOME/deps/skia/out/Release-arm64 \
          -DSKIA_LIBRARY=$HOME/deps/skia/out/Release-arm64/libskia.a \
          -DPNG_ARM_NEON:STRING=on \
          -G Ninja \
          ..
        ninja aseprite
    
    - name: Package Aseprite
      run: |
        mkdir aseprite-macos
        cp build/bin/aseprite aseprite-macos/
        cp -r build/bin/data aseprite-macos/
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aseprite-macos
        path: aseprite-macos/
